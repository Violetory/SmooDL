# Included by Nginx Proxy Manager's /data/nginx/custom/http.conf.
# The existing Cloudflare Origin certificate covers *.violetcho.tech.
server {
    listen 80;
    listen [::]:80;
    server_name smoodl.violetcho.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name smoodl.violetcho.tech;

    ssl_certificate /data/custom_ssl/npm-15/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-15/privkey.pem;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $smoodl_upstream smoodl-api:8082;

    access_log /data/logs/smoodl_access.log proxy;
    error_log /data/logs/smoodl_error.log warn;

    # Stable installation entry; the shared template asks for an API Key.
    location = /install {
        add_header Cache-Control "no-store" always;
        return 302 https://www.icloud.com/shortcuts/f560167cd07b415295e4f190941ed76c;
    }
    location = /install/ {
        add_header Cache-Control "no-store" always;
        return 302 https://www.icloud.com/shortcuts/f560167cd07b415295e4f190941ed76c;
    }

    location / {
        proxy_pass http://$smoodl_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
